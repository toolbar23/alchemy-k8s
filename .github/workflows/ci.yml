name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.6
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run release:check
