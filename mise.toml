[tools]
"aqua:k3d-io/k3d" = "5.9.0"
helm = "3.18.6"
just = "1.58.0"
node = "22.23.1"
npm = "12.0.2"

[tasks.publish]
description = "Bootstrap every unpublished npm workspace with interactive 2FA"
run = [
  "npm whoami",
  "npm ci",
  "npm run release:check",
  "node scripts/publish-packages.mjs",
]

[tasks."publish:dry-run"]
description = "Build and preview every npm workspace without publishing"
run = [
  "npm ci",
  "npm run release:check",
  "node scripts/publish-packages.mjs --dry-run",
]

[tasks."publish:oidc"]
description = "Validate, push main, and create the GitHub Release used for OIDC publishing"
depends = ["publish:dry-run"]
run = "node scripts/create-github-release.mjs"

[tasks."e2e:kubernetes-native"]
description = "Run the typed Kubernetes provider lifecycle against current and previous K3s minors"
run = "npm run build --workspace packages/kubernetes-api && node scripts/kubernetes-api-e2e/matrix.mjs"
